<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Forms</title>
</head>
<body>
<main>
    <h1>HTML Forms</h1>
    <h2>GET Form</h2>
    <form action="submit" method="get" accept-charset="UTF-8">
        <label for="getName">Name</label>
        <input id="getName" type="text" name="name" placeholder="Enter name" required>
        <button type="submit">Submit GET</button>
    </form>

    <h2>POST Form</h2>
    <form action="submit" method="post" accept-charset="UTF-8">
        <label for="postName">Name</label>
        <input id="postName" type="text" name="name" placeholder="Enter name" required>
        <button type="submit">Submit POST</button>
    </form>
</main>
</body>
</html>
